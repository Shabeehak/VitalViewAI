# CI/CD Pipeline for VitalViewAI
# Task 5 Deliverable: Continuous Integration & Deployment

name: VitalViewAI CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'
  MODEL_PATH: models/

jobs:
  # =============================================================================
  # JOB 1: Code Quality & Linting
  # =============================================================================
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort
    
    - name: Run Black (code formatter)
      run: black --check src/ --line-length 100
      continue-on-error: true
    
    - name: Run isort (import sorter)
      run: isort --check-only src/
      continue-on-error: true
    
    - name: Run Flake8 (linter)
      run: flake8 src/ --max-line-length=100 --ignore=E501,W503
      continue-on-error: true

  # =============================================================================
  # JOB 2: Unit Tests
  # =============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-benchmark
    
    - name: Create necessary directories
      run: |
        mkdir -p data/processed
        mkdir -p models
        mkdir -p logs
    
    - name: Run unit tests
      run: |
        pytest tests/test_unit.py -v --cov=src --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # =============================================================================
  # JOB 3: Data Validation
  # =============================================================================
  validate-data:
    name: Validate Data Pipeline
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate test data
      run: |
        python generate_working_data.py
    
    - name: Validate data distribution
      run: |
        python -c "
        import pandas as pd
        df = pd.read_csv('data/processed/features_working.csv')
        positive_rate = df['label'].mean()
        assert 0.30 < positive_rate < 0.50, f'Bad distribution: {positive_rate:.2%}'
        print(f'✅ Data distribution OK: {positive_rate:.1%} deteriorating')
        "

  # =============================================================================
  # JOB 4: Model Training & Evaluation
  # =============================================================================
  train-model:
    name: Train & Evaluate Models
    runs-on: ubuntu-latest
    needs: validate-data
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Generate data
      run: python generate_working_data.py
    
    - name: Engineer features
      run: |
        python -c "from src.features.feature_engineering import engineer_features_for_training; engineer_features_for_training('data/processed/features_working.csv', 'data/processed/features_engineered.csv')"
    
    - name: Train models
      run: python train_models.py
    
    - name: Evaluate models
      run: python evaluate_model.py --model xgboost
      continue-on-error: true
    
    - name: Check model performance
      run: |
        python -c "
        import json
        with open('models/xgboost_model_metadata.json') as f:
            metadata = json.load(f)
        pr_auc = metadata['performance']['pr_auc']
        assert pr_auc > 0.85, f'Model performance too low: PR-AUC={pr_auc}'
        print(f'✅ Model performance acceptable: PR-AUC={pr_auc:.4f}')
        "
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-models
        path: |
          models/*.pkl
          models/*.h5
          models/*.json
          models/*.png
        retention-days: 30

  # =============================================================================
  # JOB 5: Build Docker Images
  # =============================================================================
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: train-model
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      if: github.event_name != 'pull_request'
    
    - name: Build API image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile.api
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/vitalview-api:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/vitalview-api:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build ML Server image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: docker/Dockerfile.ml
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/vitalview-ml:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/vitalview-ml:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =============================================================================
  # JOB 6: Deploy to Staging (optional)
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.vitalview.ai
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your deployment commands here
        # e.g., kubectl apply, docker-compose up, etc.
    
    - name: Run smoke tests
      run: |
        echo "🧪 Running smoke tests..."
        # Add smoke test commands
        # curl https://staging.vitalview.ai/health

  # =============================================================================
  # JOB 7: Deploy to Production
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://vitalview.ai
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-models
        path: models/
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add your production deployment commands
    
    - name: Notify deployment
      run: |
        echo "✅ Deployment complete!"
        # Add notification (Slack, email, etc.)

  # =============================================================================
  # JOB 8: Model Monitoring
  # =============================================================================
  monitor-model:
    name: Model Performance Monitoring
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Check model drift
      run: |
        echo "📊 Checking for model drift..."
        # Add drift detection logic
    
    - name: Check performance degradation
      run: |
        echo "📉 Monitoring model performance..."
        # Add performance monitoring
    
    - name: Alert if issues found
      if: failure()
      run: |
        echo "⚠️ Model issues detected! Sending alert..."
        # Add alerting logic