# docker-compose.yaml
# VitalViewAI - Simplified Deployment
# Task 5 Deliverable: Scalability and Deployment
#
# This runs the 3 core services:
# 1. Streaming API Server (port 8000) - collects patient data
# 2. ML Model Server (port 8001) - serves predictions
# 3. Streamlit Dashboard (port 8501) - web UI

version: '3.8'

services:
  # =============================================================================
  # STREAMING API SERVER (Patient Data Collection)
  # =============================================================================
  api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: vitalview-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - vitalview-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # ML MODEL SERVING (Prediction Engine)
  # =============================================================================
  ml-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: vitalview-ml
    ports:
      - "8001:8001"
    environment:
      - MODEL_TYPE=xgboost
      - MODEL_PATH=/app/models/xgboost_model.pkl
      - BATCH_SIZE=32
      - MAX_WORKERS=4
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - vitalview-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =============================================================================
  # STREAMLIT DASHBOARD (Web UI)
  # =============================================================================
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: vitalview-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_BASE=http://api-server:8000
      - ML_API_BASE=http://ml-server:8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - vitalview-network
    depends_on:
      - api-server
      - ml-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  vitalview-network:
    driver: bridge

# =============================================================================
# NOTES
# =============================================================================
# To run:
#   docker-compose up --build
#
# To stop:
#   docker-compose down
#
# To view logs:
#   docker-compose logs -f
#
# Access points:
#   - Streaming API: http://localhost:8000
#   - ML API: http://localhost:8001
#   - Dashboard: http://localhost:8501